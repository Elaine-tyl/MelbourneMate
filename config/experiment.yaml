    query_prefix: ""
    passage_prefix: ""
    normalize: true
    max_seq_length: 512

gate:
  min_top_score: 0.3
  min_supporting_hits: 1

generation:
  provider: "ollama"
  model: "qwen2.5:7b-instruct"
  temperature: 0.0
  seed: 20260923
  prompt_version: "v1"
  max_context_passages: 5

evaluation:
  primary_metric: "ndcg@5"
  ndcg_gain: "exponential"
  cluster_field: "topic_id"
  bootstrap_resamples: 10000
  randomisation_permutations: 10000
  seed: 20260923
