protocol_version: v1
config_fingerprint: bc7099b791163711

retrieval:
  candidate_depth: 20
  final_top_k: 5
  bm25:
    k1: 1.5
    b: 0.75
    stemmer: "english"
  dense:
    model: "sentence-transformers/multi-qa-mpnet-base-cos-v1"
